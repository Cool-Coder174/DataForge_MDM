AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DataForge MDM - IAM roles for Glue, Lambda, and Step Functions.
  Demo-scoped permissions (broad-ish but bucket/region constrained where practical).

Parameters:
  ProjectName:
    Type: String
  DataBucketArn:
    Type: String

Resources:
  # ---------------------------------------------------------------- Glue
  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-glue-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: glue.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: glue-s3-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !Ref DataBucketArn
                  - !Sub "${DataBucketArn}/*"
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:${ProjectName}/*"

  # ---------------------------------------------------------------- Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: lambda-platform-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !Ref DataBucketArn
                  - !Sub "${DataBucketArn}/*"
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:${ProjectName}/*"
              - Effect: Allow
                Action: [sns:Publish]
                Resource: !Sub "arn:aws:sns:*:${AWS::AccountId}:${ProjectName}-alerts"
              - Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults, athena:StopQueryExecution]
                Resource: "*"
              - Effect: Allow
                Action: [glue:GetTable, glue:GetDatabase, glue:GetPartitions]
                Resource: "*"
              # Read-only CloudWatch access for the dashboard /alarms BFF route.
              - Effect: Allow
                Action: [cloudwatch:DescribeAlarms, cloudwatch:DescribeAlarmHistory, cloudwatch:GetMetricData]
                Resource: "*"

  # ---------------------------------------------------------------- Step Functions
  StatesExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-states-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: states-orchestration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:${ProjectName}-*"
              - Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:BatchStopJobRun
                  - glue:StartCrawler
                  - glue:GetCrawler
                Resource: "*"
              - Effect: Allow
                Action: [sns:Publish]
                Resource: !Sub "arn:aws:sns:*:${AWS::AccountId}:${ProjectName}-alerts"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !Ref DataBucketArn
                  - !Sub "${DataBucketArn}/*"

Outputs:
  GlueJobRoleArn:
    Value: !GetAtt GlueJobRole.Arn
    Export: { Name: !Sub "${ProjectName}-glue-role-arn" }
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
    Export: { Name: !Sub "${ProjectName}-lambda-role-arn" }
  StatesExecutionRoleArn:
    Value: !GetAtt StatesExecutionRole.Arn
    Export: { Name: !Sub "${ProjectName}-states-role-arn" }
