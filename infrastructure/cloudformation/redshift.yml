AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DataForge MDM - Amazon Redshift dimensional warehouse (OPT-IN / costs money).
  Single smallest node. Disabled by default (ENABLE_REDSHIFT=false) so the demo
  defaults to Athena. Password generated into Secrets Manager.

Parameters:
  ProjectName:
    Type: String
  RedshiftDatabase:
    Type: String
    Default: dataforge
  RedshiftUser:
    Type: String
    Default: dataforge_admin
  EnableRedshift:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

Conditions:
  CreateRedshift: !Equals [!Ref EnableRedshift, "true"]

Resources:
  RedshiftSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateRedshift
    Properties:
      Name: !Sub "${ProjectName}/redshift/master"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${RedshiftUser}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  RedshiftSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateRedshift
    Properties:
      GroupDescription: !Sub "${ProjectName} Redshift access (demo)"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5439
          ToPort: 5439
          CidrIp: 0.0.0.0/0

  RedshiftCluster:
    Type: AWS::Redshift::Cluster
    Condition: CreateRedshift
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ClusterIdentifier: !Sub "${ProjectName}-warehouse"
      ClusterType: single-node
      NodeType: ra3.large
      DBName: !Ref RedshiftDatabase
      MasterUsername: !Sub "{{resolve:secretsmanager:${RedshiftSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${RedshiftSecret}:SecretString:password}}"
      PubliclyAccessible: true
      VpcSecurityGroupIds: [!GetAtt RedshiftSecurityGroup.GroupId]
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  RedshiftEndpoint:
    Condition: CreateRedshift
    Value: !GetAtt RedshiftCluster.Endpoint.Address
    Export: { Name: !Sub "${ProjectName}-redshift-endpoint" }
  RedshiftSecretArn:
    Condition: CreateRedshift
    Value: !Ref RedshiftSecret
