AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DataForge MDM - Monitoring: SNS alert topic + email subscription, CloudWatch
  dashboard, and alarms (Step Functions, Glue, Lambda, API Gateway, custom DQ).

Parameters:
  ProjectName:
    Type: String
  AlertEmail:
    Type: String
  EtlJobName:
    Type: String
  DqJobName:
    Type: String

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alerts"
      DisplayName: DataForge Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # --------------------------------------------------------------- Alarms
  StepFunctionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-stepfunctions-failed"
      AlarmDescription: Pipeline state machine had a failed execution.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-pipeline"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  GlueEtlFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-glue-etl-failed"
      AlarmDescription: Glue ETL job failed task count > 0.
      Namespace: Glue
      MetricName: glue.driver.aggregate.numFailedTasks
      Dimensions:
        - Name: JobName
          Value: !Ref EtlJobName
        - Name: Type
          Value: gauge
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-lambda-errors"
      AlarmDescription: Any platform Lambda raised errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-mdm-api"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-api-5xx"
      AlarmDescription: MDM API returning 5xx errors.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${ProjectName}-mdm-api"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ApiGateway4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-api-4xx"
      AlarmDescription: MDM API elevated 4xx errors.
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${ProjectName}-mdm-api"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Custom metrics emitted by the DQ Glue job (namespace = ProjectName/DataQuality)
  DataQualityScoreAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-dq-score-low"
      AlarmDescription: Data quality score dropped below threshold.
      Namespace: !Sub "${ProjectName}/DataQuality"
      MetricName: QualityScore
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0.95
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  RejectedRowsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-rejected-rows-high"
      AlarmDescription: Rejected record count above threshold.
      Namespace: !Sub "${ProjectName}/DataQuality"
      MetricName: RejectedRows
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  RedshiftLoadFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-redshift-load-failed"
      AlarmDescription: Redshift COPY/load reported a failure (custom metric).
      Namespace: !Sub "${ProjectName}/Warehouse"
      MetricName: RedshiftLoadFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # --------------------------------------------------------------- Dashboard
  PlatformDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-platform"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Step Functions Executions",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/States", "ExecutionsStarted", "StateMachineArn", "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-pipeline" ],
                  [ ".", "ExecutionsSucceeded", ".", "." ],
                  [ ".", "ExecutionsFailed", ".", "." ]
                ],
                "stat": "Sum", "period": 300
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Data Quality Score / Rejected Rows",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "${ProjectName}/DataQuality", "QualityScore" ],
                  [ "${ProjectName}/DataQuality", "RejectedRows", { "yAxis": "right" } ]
                ],
                "stat": "Average", "period": 300
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "MDM API (invocations / errors)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ProjectName}-mdm-api" ],
                  [ ".", "Errors", ".", "." ]
                ],
                "stat": "Sum", "period": 300
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway 4xx / 5xx",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/ApiGateway", "4XXError", "ApiName", "${ProjectName}-mdm-api" ],
                  [ ".", "5XXError", ".", "." ]
                ],
                "stat": "Sum", "period": 300
              }
            }
          ]
        }

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic
    Export: { Name: !Sub "${ProjectName}-alert-topic-arn" }
  DashboardName:
    Value: !Ref PlatformDashboard
